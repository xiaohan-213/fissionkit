name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q

  min-versions:
    name: min-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install declared minimum dependencies
        run: >-
          python -m pip install
          "numpy==1.22.4"
          "scipy==1.8.1"
          "scikit-learn==1.1.3"
          "pytest>=7"
          -e .

      - name: Run tests at minimum dependency versions
        run: python -m pytest tests/ -q

  typecheck:
    name: typecheck (${{ matrix.python-version }}, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            label: current
            deps: "numpy scipy scikit-learn"
          - python-version: "3.9"
            label: minimum
            deps: "numpy==1.22.4 scipy==1.8.1 scikit-learn==1.1.3"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install mypy and dependencies
        run: python -m pip install mypy ${{ matrix.deps }}

      - name: Run mypy
        run: mypy src/fissionkit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.16,<0.17"

      - name: Run Ruff
        run: ruff check src tests examples scripts

      - name: Run bytecode release-tool self-test
        run: python scripts/bytecode_diff.py --self-test src

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Check wheel matches tested source tree
        run: python scripts/check_wheel.py dist/*.whl src/fissionkit

      - name: Check installed version matches source version
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata as md
          import fissionkit
          import sys

          dist_version = md.version("fissionkit")
          source_version = fissionkit.__version__
          print(f"dist metadata {dist_version} | __version__ {source_version}")
          sys.exit(0 if dist_version == source_version else 1)
          PY

      - name: Ensure source distribution contains no build caches
        shell: bash
        run: |
          if tar tzf dist/*.tar.gz | grep -E '(^|/)(build|__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache)/'; then
            echo "Build artefacts are present in the source distribution."
            exit 1
          else
            echo "Source distribution is clean."
          fi
