name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  min-versions:
    # The lower bounds declared in pyproject.toml (and in the manuscript's
    # Table 1) are only meaningful if the suite is run at them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install "numpy==1.22.4" "scipy==1.8.1" "scikit-learn==1.1.3" "pytest>=7" -e .
      - run: python -m pytest tests/ -q

  typecheck:
    # The package ships a py.typed marker; this job is what makes that a
    # claim rather than a file.  Default strictness, public package only.
    # Run at the newest NumPy (whose typing gets stricter with each minor -
    # 2.5 rejected an assignment that 2.4 typed as Any) and at the declared
    # minimum, because the two disagree about what the annotations mean.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            deps: "numpy scipy scikit-learn"
          - python-version: "3.9"
            deps: "numpy==1.22.4 scipy==1.8.1 scikit-learn==1.1.3"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install mypy ${{ matrix.deps }}
      - run: mypy src/fissionkit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.16,<0.17"   # pinned range: the default rule set changes between minor versions
      # Static checks only; no enforced formatting.  Reformatting every source
      # file inside a patch release would produce a diff large enough to hide
      # the substantive changes.  Adopt a formatter in a commit of its own.
      - run: ruff check src tests examples scripts
      - name: release-tooling self-tests (stdlib only)
        run: |
          python scripts/bytecode_diff.py --self-test src
          python scripts/fill_placeholders.py --self-test

  package:
    # Guards the two defects fixed in 0.1.7: a stale version in the built
    # distribution, and build artefacts leaking into the archive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: wheel ships exactly the tested source tree
        run: python scripts/check_wheel.py dist/*.whl src/fissionkit
      - name: version metadata matches the source
        run: |
          pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata as md, fissionkit, sys
          a, b = md.version("fissionkit"), fissionkit.__version__
          print(f"dist metadata {a} | __version__ {b}")
          sys.exit(0 if a == b else 1)
          PY
      - name: no build artefacts in the sdist
        run: |
          tar tzf dist/*.tar.gz | grep -E "(^|/)(build|__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache)/" \
            && { echo "build artefacts present in sdist"; exit 1; } || echo "clean"
